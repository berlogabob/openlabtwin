<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab TV</title>
<link rel="icon" href="data:,">
<!-- Showcase TV, served by the edge node (docs/edge-node.md): schedule column + carousel. No build step. -->
<style>
:root { --fg: #1a1a1a; --muted: #666; --bg: #fafaf7; --card: #fff; --line: #e3e1da; --accent: #b3261e;
        --booking: #1e5cb3; --event: #1eb350; --mat: #efece4; --frame: #d9d5ca; }
* { box-sizing: border-box; }
html { font-size: clamp(14px, 1.05vw, 40px); }
body { margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 2fr; grid-template-rows: auto 1fr auto;
       font: 1rem/1.35 system-ui, sans-serif; color: var(--fg); background: var(--bg); overflow: hidden; }
/* one line across the top: the day (it belongs to the schedule below it) on the left, the room(s) on the right */
#top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
       padding: .7rem 1.4rem; border-bottom: 1px solid var(--line); font-size: 1.2rem; font-weight: 600; white-space: nowrap; }
#top .rooms { overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; text-transform: uppercase; font-size: 1rem; }
#schedule { contain: strict; padding: .8rem 1.2rem; border-right: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; gap: .6rem; }
/* sizes in em below: fitSchedule() shrinks the whole column until a busy day fits */
#schedule section { flex: none; }
#schedule h2 { margin: 0 0 .3em; font-size: .8em; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
/* one colour per card (--c): the left stripe, and the outline of the slot running now. Outlines take no space: nothing shifts. */
article { --c: var(--accent); margin: 0 0 .3em; padding: .25em .6em; font-size: .9em; line-height: 1.25; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; }
article p { margin: 0; }
article .time { font-weight: 600; font-variant-numeric: tabular-nums; margin-right: .35em; white-space: nowrap; }
article .who { color: var(--muted); font-size: .89em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
article.booking { --c: var(--booking); }
article.event { --c: var(--event); }
article.past { opacity: .4; }
article.now { outline: 2px solid var(--c); outline-offset: -1px; }
.empty { color: var(--muted); }
.now-line { display: flex; align-items: center; gap: .4em; margin: .1em 0 .45em; color: var(--accent); font-size: .8em; font-weight: 600; font-variant-numeric: tabular-nums; }
.now-line::after { content: ""; flex: 1; border-top: 2px solid var(--accent); }
#stage { position: relative; background: var(--mat); display: flex; align-items: center; justify-content: center; contain: strict; }
/* passe-partout: the mat is the stage, the frame's opening takes the slide's shape */
/* no blurred shadow: over a playing video it costs a slow TV computer every frame */
#frame { background: var(--card); box-shadow: 0 0 0 .35rem #fff, 0 0 0 calc(.35rem + 1px) var(--frame);
         display: flex; overflow: hidden; }
#frame img, #frame video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
#frame.bio img, #frame.qr img { width: auto; max-width: 45%; object-fit: cover; background: none; }
#frame.qr img { object-fit: contain; padding: 2rem; }
/* text sizes in em: fitText() shrinks the whole block until it fits the frame */
#frame .text { flex: 1; min-width: 0; padding: 2.5rem; display: flex; flex-direction: column; justify-content: center; gap: .6em; overflow: hidden; }
#frame .text p { margin: 0; }
#frame h1 { margin: 0; font-size: 3em; line-height: 1.1; overflow-wrap: anywhere; }
#frame .body { font-size: 1.6em; line-height: 1.35; color: var(--muted); white-space: pre-line; overflow-wrap: anywhere; }
#frame .when { font-size: 1.6em; color: var(--event); font-weight: 600; }
#frame .place { font-size: 1.3em; color: var(--muted); }
#frame.idea .when { color: var(--accent); }
#caption { position: absolute; bottom: 1.2rem; left: 0; right: 0; text-align: center; font-size: 1.3rem; color: var(--muted); }
body.full { grid-template-columns: 1fr; grid-template-rows: 1fr; }
body.full #top, body.full #schedule, body.full footer { display: none; }
body.full #frame h1 { font-size: 4.5em; }
body.full #frame .body, body.full #frame .when { font-size: 2.4em; }
footer .stale { color: var(--accent); font-weight: 600; }
footer { grid-column: 1 / -1; padding: .2rem 1.4rem; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header id="top"><span class="date"></span><span class="rooms"></span></header>
<aside id="schedule"></aside>
<main id="stage"><div id="frame"></div><p id="caption"></p></main>
<footer></footer>
<script>
const DEFAULT_ROOM = 'Lab. e Estudo de Jogos - Tech Lab (Oriente)';
const rooms = new URLSearchParams(location.search).getAll('room');
if (!rooms.length) rooms.push(DEFAULT_ROOM);
let lessons = [], tv = { slides: [], ideas: [] }, updated = null, current = null, shown = '';

// Video quality: the node makes 480p, 720p and 1080p copies. Start from what the device says it is, then let dropped
// frames decide: step down when a video stutters, back up after 5 smooth plays. Remembered across reloads.
const store = (k, v) => { try { return v === undefined ? localStorage.getItem(k) : localStorage.setItem(k, v); } catch { return null; } };
let tier = +store('tv-tier') || ((navigator.deviceMemory || 4) <= 2 || (navigator.hardwareConcurrency || 4) <= 4 ? 720 : 1080);
let smooth = 0, playing = null;
const setTier = t => { tier = t; smooth = 0; store('tv-tier', t); };
function videoSrc(s) {  // the largest copy not above the tier, else the smallest; the original only before copies exist
  const hs = Object.keys(s.renditions || {}).map(Number).sort((a, b) => a - b);
  if (!hs.length) return s.src;
  const fit = hs.filter(h => h <= tier);
  return s.renditions[fit.length ? fit[fit.length - 1] : hs[0]];
}
function judge(v) {  // after a video: more than 10% dropped frames -> lighter copies; 5 smooth plays -> heavier
  const q = v.getVideoPlaybackQuality && v.getVideoPlaybackQuality();
  if (!q || q.totalVideoFrames < 100) return;
  const drop = q.droppedVideoFrames / q.totalVideoFrames;
  if (drop > 0.1 && tier > 480) setTier(tier > 720 ? 720 : 480);
  else if (drop < 0.01 && ++smooth >= 5 && tier < 1080) setTier(tier < 720 ? 720 : 1080);
}

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};
const get = async url => {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
};

async function load() {  // keep the last good copy when a reload fails
  try { lessons = await get('data/all.json'); updated = new Date(); } catch (e) { console.warn(e); }
  try { tv = await get('tv.json'); updated = new Date(); } catch (e) { console.warn(e); }
  schedule();
  tick();
}

function schedule() {
  const now = new Date(), day = iso(now), clock = hm(now);
  const aside = document.getElementById('schedule'), short = r => r.replace(/ \(Oriente\)$/, '');
  document.querySelector('#top .date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  document.querySelector('#top .rooms').textContent = rooms.map(short).join(' · ');
  aside.replaceChildren();
  for (const room of rooms) {
    const sec = el('section');
    if (rooms.length > 1) sec.append(el('h2', null, short(room)));  // one room: its name is already in the top line
    const items = lessons.filter(l => l.date === day && l.rooms.includes(room)).sort((a, b) => a.start.localeCompare(b.start));
    if (!items.length) sec.append(el('p', 'empty', 'Free all day'));
    const at = items.findIndex(l => l.start > clock), line = at < 0 ? items.length : at;  // before the first not yet started
    const nowLine = () => sec.append(el('div', 'now-line', clock));
    for (const [i, l] of items.entries()) {
      if (i === line) nowLine();
      const cls = [l.layer !== 'lesson' && l.layer, l.end <= clock && 'past', l.start <= clock && l.end > clock && 'now'];
      const a = el('article', cls.filter(Boolean).join(' '));
      const line1 = el('p', 'course');
      line1.append(el('span', 'time', `${l.start}–${l.end}`), l.course);
      a.append(line1);
      const who = [l.teachers.join(', '), l.groups.join(', ')].filter(Boolean).join(' · ');
      if (who) a.append(el('p', 'who', who));
      sec.append(a);
    }
    if (items.length && line === items.length) nowLine();
    aside.append(sec);
  }
  const foot = document.querySelector('footer'), built = Date.parse(tv.generated || '');
  foot.textContent = updated ? `updated ${hm(updated)} · video ${tier}p` : '';
  if (built && Date.now() - built > 5 * 60 * 1000) {  // the node stopped rebuilding: say so instead of playing old content quietly
    foot.append(' · ', el('span', 'stale', `playlist from ${hm(new Date(built))}: the lab node is not updating it`));
  }
  fitSchedule();
}

function live() {  // the pages for this moment, on the TV's own clock; a takeover page on hides all the others
  const c = hm(new Date()), on = tv.slides.filter(s => (!s.from || s.from <= c) && (!s.to || c < s.to));
  const takeover = on.some(s => s.takeover);
  return { takeover, slides: takeover ? on.filter(s => s.takeover) : on };
}

// Clock sync: every screen works out the page from the clock, so several TVs show the same page at the same moment.
// The loop runs from the epoch: loop n started at n * L seconds, where L is the loop's total length. Ideas are picked
// with a seed from n, so every screen picks the same ones. Screens need correct clocks (network time).
function rng(seed) {  // mulberry32: a small seeded random number generator
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const length = s => (s.video ? s.seconds || s.length || 30 : s.seconds || 10);  // seconds a page stays

function where(t) {  // at time t (seconds since the epoch): the page, how far into it, and a key that changes per page
  const pages = live().slides, per = Math.min(3, tv.ideas.length);
  const lens = pages.map(s => (s.kind === 'ideas' ? per * (s.seconds || 12) : length(s)));
  const L = lens.reduce((a, b) => a + b, 0);
  if (!L) return null;
  const n = Math.floor(t / L);
  let off = t - n * L, i = 0;
  while (off >= lens[i]) off -= lens[i++];
  let page = pages[i];
  if (page.kind === 'ideas') {  // 3 ideas from a seed shared by every screen; the AI's anonymous version only
    const r = rng(n * 31 + i), pool = [...tv.ideas];
    for (let k = pool.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [pool[k], pool[j]] = [pool[j], pool[k]]; }
    const one = page.seconds || 12, idea = pool[Math.floor(off / one)];
    page = { kind: 'idea', when: 'Student idea', title: idea.title, body: idea.summary };
    off %= one;
  }
  return { page, off, key: `${n}/${i}/${page.title}/${page.src}` };
}

function tick() {  // 4 times a second: show the page the clock says; keep a playing video within a second of the clock
  const w = where(Date.now() / 1000);
  if (!w) { shown = ''; return; }
  if (w.key !== shown) { shown = w.key; show(w.page, w.off); return; }
  const v = document.querySelector('#frame video');
  if (v && v.readyState >= 2 && Math.abs(v.currentTime - w.off) > 1.5) v.currentTime = w.off;
}

function fit() {  // the frame's opening takes the slide's shape, as large as the mat allows
  if (!current) return;
  const stage = document.getElementById('stage'), frame = document.getElementById('frame');
  const ratio = current.kind === 'media' && current.w && current.h ? current.w / current.h : 16 / 9;
  const k = document.body.classList.contains('full') ? 0.94 : 0.86;
  const W = stage.clientWidth * k, H = stage.clientHeight * (k - 0.06);
  const w = W / H > ratio ? H * ratio : W;
  frame.style.width = `${w}px`;
  frame.style.height = `${w / ratio}px`;
}

function fitSchedule() {  // a busy day: shrink the column's text until every card fits, down to 55%
  const aside = document.getElementById('schedule');
  for (let size = 100; size >= 55; size -= 5) {
    aside.style.fontSize = `${size}%`;
    if (aside.scrollHeight <= aside.clientHeight) return;
  }
}

function fitText(box) {  // shrink the slide's text until it fits inside the frame, down to 40%
  if (!box) return;
  for (let size = 100; size >= 40; size -= 5) {
    box.style.fontSize = `${size}%`;
    if (box.scrollHeight <= box.clientHeight && box.scrollWidth <= box.clientWidth) return;
  }
}

function show(s, off) {
  if (playing) judge(playing);
  playing = null;
  current = s;
  document.body.classList.toggle('full', !!s.full);  // full screen: the page alone, schedule hidden
  const frame = document.getElementById('frame');
  frame.className = s.kind;
  frame.replaceChildren();
  document.getElementById('caption').textContent = s.kind === 'media' ? s.title : '';
  fit();
  if (s.video) {  // starts at the clock's second; the clock, not the video's end, moves on to the next page
    const v = el('video');
    Object.assign(v, { src: videoSrc(s), muted: true, autoplay: true, playsInline: true, preload: 'auto' });
    v.addEventListener('loadedmetadata', () => { if (off > 0.5) v.currentTime = off; }, { once: true });
    playing = v;
    frame.append(v);
    v.play().catch(() => {});
    return;
  }
  if (s.src) {
    const img = el('img');
    Object.assign(img, { src: s.src, alt: s.title || '' });
    frame.append(img);
  }
  if (s.kind !== 'media') {
    const text = el('div', 'text');
    if (s.when) text.append(el('p', 'when', s.when));
    text.append(el('h1', null, s.title || ''));
    if (s.place) text.append(el('p', 'place', s.place));
    if (s.body) text.append(el('p', 'body', s.body));
    frame.append(text);
    fitText(text);
  }
}

addEventListener('resize', () => { fit(); fitText(document.querySelector('#frame .text')); fitSchedule(); });
load();
// every screen reloads at second 20 of each minute, after the node's rebuild at second 0: all of them see the same playlist
setTimeout(() => { load(); setInterval(load, 60 * 1000); }, (80 - new Date().getSeconds()) % 60 * 1000 || 60 * 1000);
setInterval(tick, 250);
</script>
</body>
</html>
