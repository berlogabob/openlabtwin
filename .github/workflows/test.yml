name: Test

on:
  push:
  pull_request:

# Database tests (supabase/tests/database) run locally with `uv run python scripts/sqltest.py` against the
# hosted project over HTTPS before any migration is pushed. They used to run here in a Docker Supabase, but
# GitHub's container registry rate-limits those image pulls (toomanyrequests), so CI kept failing on infrastructure.
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Python tests
        run: for t in tests/test_*.py; do uv run python "$t"; done

  tv-page:  # the showcase TV page in real Chrome (the runner has it), before the edge node pulls it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with playwright python tests/check_tv_page.py

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  office:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/office
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
