name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Python tests
        run: for t in tests/test_*.py; do uv run python "$t"; done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - name: Database tests
        run: supabase test db
